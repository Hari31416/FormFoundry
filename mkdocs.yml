site_name: FormFoundry
site_description: Generalized form-filling and artifact-generation platform documentation.
site_author: FormFoundry Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Architecture:
    - Overview: architecture/overview.md
    - Backend Architecture: architecture/backend-architecture.md
    - Frontend Architecture: architecture/frontend-architecture.md
    - Data Flow: architecture/data-flow.md
  - Backend:
    - Overview: backend/README.md
    - App Initialization: backend/app-initialization.md
    - Routing: backend/routing.md
    - Dependency Injection: backend/dependency-injection.md
    - Models: backend/models.md
    - Schemas: backend/schemas.md
    - Services: backend/services.md
    - Database: backend/database.md
  - Frontend:
    - Overview: frontend/README.md
    - Project Structure: frontend/project-structure.md
    - API Layer: frontend/api-layer.md
    - No-Code Platform: frontend/no-code-platform.md
    - Design System: frontend/design-system.md
  - API Reference:
    - Backend Endpoints: api-reference/backend-endpoints.md
  - Development:
    - Local Setup: development/local-setup.md
    - Docker Infrastructure: development/docker.md
  - Decisions: decisions/architectural-decisions.md
  - Glossary: glossary.md
