[project]
name = "formfoundry-backend"
version = "0.1.0"
description = "Backend services for FormFoundry"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "greenlet>=3.2.4",
  "httpx>=0.28.0",
  "litellm>=1.79.3",
  "jinja2>=3.1.6",
  "minio>=7.2.0",
  "pymupdf>=1.26.5",
  "pydantic-settings>=2.10.0",
  "pypdf>=6.1.3",
  "python-multipart>=0.0.20",
  "redis>=6.0.0",
  "reportlab>=4.4.4",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
  "googletrans==4.0.2",
  "langdetect>=1.0.9",
  "pydub>=0.25.1",
  "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
  "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
  "black>=25.9.0",
  "isort>=6.0.1",
  "pre-commit>=4.3.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "mkdocs-material>=9.6.0",
  "pymdown-extensions>=10.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
