services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formfoundry}
      POSTGRES_USER: ${POSTGRES_USER:-formfoundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formfoundry%40123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formfoundry} -d ${POSTGRES_DB:-formfoundry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis%40123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis%40123}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs-volume-permissions:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.1
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-formfoundry}}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY:-formfoundry123}}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  # qdrant:
  #   image: qdrant/qdrant:v1.15.4
  #   restart: unless-stopped
  #   ports:
  #     - "${QDRANT_PORT:-6333}:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
